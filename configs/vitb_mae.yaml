training:
  epochs: 600
  warmup_epochs: 40
  checkpoints: './checkpoints/'
  batch_size: 32
  num_workers: 8
  use_fp16: True
  saveckp_freq: 50

model:
  type: 'MaskedAutoencoderViT3D'
  img_size: [128,128,128]
  patch_size: 16
  in_chans: 1
  embed_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  qkv_bias: True
  drop_path_rate: 0.
  p: 0.
  attn_p: 0.
  patch_embed_fun: 'conv3d'
  decoder_embed_dim: 576
  decoder_depth: 8
  decoder_num_heads: 16
  norm_pix_loss: False

optimizer:
  optimizer: 'adamw'
  lr: 0.0001
  weight_decay: 0.0001
  min_lr: 0.0000001
  beta1: 0.9
  beta2: 0.95
  clip_grad: 3

transforms:
  spacing: [1.75, 1.75, 1.75]
  resize: [128, 128, 128]
  normalize_non_zero: True
  orientation: "RAS"
  cache_dir_train: None
  cache_dir_test: None

IXI:
  dataroot: "./data/IXI-T1/hdbet/IXI*/*T1.nii.gz"

HCP:
  dataroot: "./data/HCP/hdbet/*/hdbet_n4*1.nii.gz"
